name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, WITHOUT the leading v (e.g. 1.2.3)'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-jars:
    name: Build & publish jars
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          # Reject anything that is not a version: the value ends up in a filename and a
          # git tag.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$VERSION' is not a valid version (expected 1.2.3 or 1.2.3-rc1)"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing v$VERSION"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build & test
        run: |
          ./gradlew test :cli:bootJar :kt-judge:bootJar \
            -PreleaseVersion=${{ steps.version.outputs.version }}

      # download URL is stable across releases
      #   https://github.com/<owner>/<repo>/releases/latest/download/cs30.jar
      # The version is in the tag and in each jar's manifest.
      - name: Stage release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          mkdir -p dist
          cp "cli/build/libs/cs30-$VERSION.jar" dist/cs30.jar
          cp kt-judge/build/libs/kt-judge.jar   dist/kt-judge.jar

          cd dist
          sha256sum cs30.jar kt-judge.jar > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          # An -rc / -beta / -alpha suffix publishes a prerelease, which keeps it out of
          # the /releases/latest endpoint and off the top of the Releases page.
          prerelease=()
          case "$VERSION" in
            *-*) prerelease=(--prerelease) ;;
          esac

          gh release create "v$VERSION" \
            dist/cs30.jar dist/kt-judge.jar dist/SHA256SUMS.txt \
            --title "v$VERSION" \
            --generate-notes \
            --target "$GITHUB_SHA" \
            --draft \
            "${prerelease[@]}"

  publish-sandbox-image:
    name: Publish judge sandbox image
    needs: publish-jars
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          VERSION: ${{ needs.publish-jars.outputs.version }}
        run: |
          set -euo pipefail

          IMAGE=ghcr.io/sjsu-cs-systems-group/judge-sandbox

          {
            echo "tags<<EOF"
            echo "$IMAGE:v$VERSION"
            echo "$IMAGE:$GITHUB_SHA"
            case "$VERSION" in
              *-*) echo "prerelease $VERSION does not move :latest" >&2 ;;
              *)   echo "$IMAGE:latest" ;;
            esac
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build & push versioned sandbox image
        uses: docker/build-push-action@v5
        with:
          context: kt-judge/sandbox
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-release:
    name: Publish the release
    needs: [publish-jars, publish-sandbox-image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # flip the release out of draft
    steps:
      - name: Undraft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.publish-jars.outputs.version }}
        run: |
          set -euo pipefail

          gh release edit "v$VERSION" --draft=false

          echo "Published v$VERSION"
          gh release view "v$VERSION" --json isDraft,isPrerelease,assets \
            --jq '{draft: .isDraft, prerelease: .isPrerelease, assets: [.assets[].name]}'
