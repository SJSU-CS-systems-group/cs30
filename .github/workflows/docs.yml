name: Docs

# Builds the Jekyll site in docs/ and, on main, publishes it to GitHub Pages
# (cs30.app). Pull requests build only, so a broken link tag target or bad front
# matter fails the check before it can reach the live site.
#
# Requires the repository's Pages source to be set to "GitHub Actions"
# (Settings -> Pages). The legacy "deploy from branch /docs" mode serves the raw
# markdown source instead of the built site.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    # Only builds here — no Pages API access, so this job keeps contents: read.
    # PR builds must not contend with each other or with an in-flight deploy, so
    # the serialising guard lives on the deploy job, keyed per ref.
    concurrency:
      group: docs-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: docs

      - name: Build
        run: bundle exec jekyll build --destination _site --strict_front_matter
        working-directory: docs
        env:
          JEKYLL_ENV: production

      # No actions/configure-pages step: it calls the Pages API and so needs
      # pages: write in this job, and nothing here consumes its base_url/base_path
      # outputs (baseurl is fixed to "" in _config.yml for the apex domain).
      # deploy-pages does not require it.
      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    name: Deploy to Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Never let two deploys race, and never cancel one mid-publish.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
