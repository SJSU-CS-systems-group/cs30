name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep -Po '"tag_name": "v\K[^"]*')
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Run gitleaks
        run: gitleaks detect --source . --no-banner --redact

  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test

      - name: Build unified jar
        run: ./gradlew :cli:bootJar

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/test-results/**/*.xml'
          retention-days: 14
          if-no-files-found: warn

      - name: Upload cs30 jar
        uses: actions/upload-artifact@v4
        with:
          name: cs30-${{ github.sha }}
          path: cli/build/libs/cs30-1.0-SNAPSHOT.jar
          retention-days: 30

  docker-judge:
    name: Judge sandbox image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Detect judge sandbox changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            judge:
              - 'kt-judge/sandbox/**'

      - name: Set up Docker Buildx
        if: steps.filter.outputs.judge == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.filter.outputs.judge == 'true' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main) judge sandbox image
        if: steps.filter.outputs.judge == 'true'
        uses: docker/build-push-action@v5
        with:
          context: kt-judge/sandbox
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/judge-sandbox:latest
            ghcr.io/${{ github.repository_owner }}/judge-sandbox:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-prod:
    name: Deploy to prod (server 7)
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, cs30-prod]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set systemd user session env
        run: echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"

      - name: Download built jar
        uses: actions/download-artifact@v4
        with:
          name: cs30-${{ github.sha }}
          path: /tmp/cs30-deploy

      - name: Sync application.properties
        run: cp deploy/application.properties ~/cs30/application.properties

      - name: Write secrets env file
        env:
          DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.PROD_GOOGLE_CLIENT_SECRET }}
        run: |
          umask 077
          printf 'DB_PASSWORD=%s\nGOOGLE_CLIENT_SECRET=%s\n' "$DB_PASSWORD" "$GOOGLE_CLIENT_SECRET" > ~/cs30/cs30.env

      - name: Deploy new release
        id: deploy
        run: |
          set -euo pipefail
          PREV_RELEASE=$(readlink -f ~/cs30/current || true)
          echo "prev_release=${PREV_RELEASE}" >> "$GITHUB_OUTPUT"

          RELEASE_DIR=~/cs30/releases/${{ github.sha }}
          mkdir -p "$RELEASE_DIR"
          cp /tmp/cs30-deploy/cs30-1.0-SNAPSHOT.jar "$RELEASE_DIR/cs30.jar"
          ln -sfn "$RELEASE_DIR" ~/cs30/current

          systemctl --user restart cs30

          # NOTE: matches the template's current default of SSL disabled (plain
          # HTTP on 8443). Once you enable server.ssl.* in application.properties,
          # change this back to https:// or the health check will always fail.
          for i in $(seq 1 10); do
            sleep 3
            if curl -kfs http://localhost:8443/login > /dev/null; then
              echo "Deploy healthy"
              exit 0
            fi
          done

          echo "Health check failed, rolling back"
          if [ -n "$PREV_RELEASE" ]; then
            ln -sfn "$PREV_RELEASE" ~/cs30/current
            systemctl --user restart cs30
          fi
          exit 1

      - name: Prune old releases (keep last 5)
        if: always()
        run: |
          cd ~/cs30/releases
          ls -1t | tail -n +6 | xargs -r rm -rf --
