name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test

      - name: Build unified jar
        run: ./gradlew :cli:bootJar

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/test-results/**/*.xml'
          retention-days: 14
          if-no-files-found: warn

      - name: Upload cs30 jar
        uses: actions/upload-artifact@v4
        with:
          name: cs30-${{ github.sha }}
          path: cli/build/libs/cs30-1.0-SNAPSHOT.jar
          retention-days: 30

  docker-judge:
    name: Judge sandbox image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Detect judge sandbox changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            judge:
              - 'kt-judge/sandbox/**'

      - name: Set up Docker Buildx
        if: steps.filter.outputs.judge == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.filter.outputs.judge == 'true' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main) judge sandbox image
        if: steps.filter.outputs.judge == 'true'
        uses: docker/build-push-action@v5
        with:
          context: kt-judge/sandbox
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/judge-sandbox:latest
            ghcr.io/${{ github.repository_owner }}/judge-sandbox:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
