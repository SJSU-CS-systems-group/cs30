name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Run gitleaks
        run: gitleaks detect --source . --no-banner --redact

  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build & test
        run: ./gradlew test :cli:bootJar :kt-judge:bootJar

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/test-results/**/*.xml'
          retention-days: 14
          if-no-files-found: warn

      - name: Upload cs30 jar
        uses: actions/upload-artifact@v4
        with:
          name: cs30-${{ github.sha }}
          path: cli/build/libs/cs30-*.jar
          retention-days: 30

      - name: Upload kt-judge jar
        uses: actions/upload-artifact@v4
        with:
          name: kt-judge-${{ github.sha }}
          path: kt-judge/build/libs/kt-judge.jar
          retention-days: 30

  docker-judge:
    name: Judge sandbox image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Detect judge sandbox changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            judge:
              - 'kt-judge/sandbox/**'

      - name: Set up Docker Buildx
        if: steps.filter.outputs.judge == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.filter.outputs.judge == 'true' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main) judge sandbox image
        if: steps.filter.outputs.judge == 'true'
        uses: docker/build-push-action@v5
        with:
          context: kt-judge/sandbox
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/sjsu-cs-systems-group/judge-sandbox:latest
            ghcr.io/sjsu-cs-systems-group/judge-sandbox:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-prod:
    name: Deploy to prod (server 7)
    needs: [build-test, secret-scan, docker-judge]
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, cs30-prod-v2]
    environment: production
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    env:
      APP_ROOT: /opt/cs30

    steps:
      - uses: actions/checkout@v4

      - name: Download built jar
        uses: actions/download-artifact@v4
        with:
          name: cs30-${{ github.sha }}
          path: /tmp/cs30-deploy

      - name: Download judge jar
        uses: actions/download-artifact@v4
        with:
          name: kt-judge-${{ github.sha }}
          path: /tmp/kt-judge-deploy

      - name: Sync application.properties
        run: |
          set -euo pipefail

          cp deploy/application.properties "$APP_ROOT/application.properties"

      - name: Write secrets env file
        env:
          DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.PROD_GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          umask 077

          printf \
            'DB_PASSWORD=%s\nGOOGLE_CLIENT_SECRET=%s\n' \
            "$DB_PASSWORD" \
            "$GOOGLE_CLIENT_SECRET" \
            > "$APP_ROOT/cs30.env"

          chmod 0600 "$APP_ROOT/cs30.env"

      - name: Pull judge sandbox image from GHCR
        run: |
          set -euo pipefail

          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "ghcr.io/$OWNER/judge-sandbox:latest" \
            || echo "WARNING: sandbox image pull failed; judge may be unhealthy"

      - name: Deploy new release
        id: deploy
        run: |
          set -euo pipefail

          PREV_RELEASE=$(readlink -f "$APP_ROOT/current" || true)
          echo "prev_release=${PREV_RELEASE}" >> "$GITHUB_OUTPUT"

          RELEASE_DIR="$APP_ROOT/releases/${GITHUB_SHA}"

          mkdir -p "$RELEASE_DIR"

          cp /tmp/cs30-deploy/cs30-*.jar "$RELEASE_DIR/cs30.jar"
          cp /tmp/kt-judge-deploy/kt-judge.jar "$RELEASE_DIR/kt-judge.jar"

          ln -sfn "$RELEASE_DIR" "$APP_ROOT/current"

          # Roll the single 'current' symlink back and restart both services, so
          # a failure always lands both jars on the previous release together.
          rollback() {
            echo "Rolling back BOTH services"
            if [ -n "$PREV_RELEASE" ]; then
              ln -sfn "$PREV_RELEASE" "$APP_ROOT/current"
              sudo /usr/bin/systemctl restart kt-judge.service || true
              sudo /usr/bin/systemctl restart cs30.service     || true
            else
              echo "No previous release available"
            fi
            exit 1
          }

          # Judge first (the backend calls it at :8000 on startup), but NON-FATAL:
          # a judge problem warns and never blocks/rolls back the deploy.
          if sudo /usr/bin/systemctl restart kt-judge.service; then
            judge_up=""
            for i in $(seq 1 10); do
              sleep 3
              if curl --fail --silent --max-time 5 \
                http://127.0.0.1:8000/health > /dev/null; then
                judge_up=1
                break
              fi
            done

            if [ -n "$judge_up" ]; then
              if curl --fail --silent --max-time 5 \
                http://127.0.0.1:8000/ready > /dev/null; then
                echo "Judge ready"
              else
                echo "WARNING: judge up but /ready 503 (Docker/sandbox image?) - continuing"
              fi
            else
              echo "WARNING: judge /health did not come up - continuing (deploy not blocked)"
            fi
          else
            echo "WARNING: kt-judge.service restart failed (unit installed?) - continuing"
          fi

          # Backend second - this is the deploy gate.
          sudo /usr/bin/systemctl restart cs30.service || rollback

          for i in $(seq 1 20); do
            sleep 3

            if curl \
              --fail \
              --silent \
              --insecure \
              --max-time 5 \
              https://127.0.0.1:8443/health \
              > /dev/null; then
              echo "Deploy healthy"
              exit 0
            fi
          done

          echo "Backend health check failed"
          rollback

      - name: Prune old releases (keep last 5)
        if: success()
        run: |
          set -euo pipefail

          cd "$APP_ROOT/releases"

          ls -1t |
            tail -n +6 |
            xargs -r rm -rf --

      - name: Clean deployment files
        if: always()
        run: |
          rm -rf /tmp/cs30-deploy /tmp/kt-judge-deploy