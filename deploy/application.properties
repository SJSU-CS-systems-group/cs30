server.port=443

app.timezone=America/Los_Angeles

server.ssl.enabled=true
server.ssl.certificate=/etc/ssl/cs30/fullchain.pem
server.ssl.certificate-private-key=/etc/ssl/cs30/privkey.pem

server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/plain,application/javascript,text/javascript,application/json,application/wasm,image/svg+xml
server.compression.min-response-size=1024

spring.datasource.url=jdbc:postgresql://localhost:5432/cs30db
spring.datasource.username=cs30
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

google.client-id=160623963910-reen5hga1n171tjoc224snv4ktiv9i8m.apps.googleusercontent.com
google.client-secret=${GOOGLE_CLIENT_SECRET}
google.redirect-uri=https://sjsu.cs30.app/callback
google.ta-redirect-uri=https://sjsu.cs30.app/ta/callback
google.admin-redirect-uri=https://sjsu.cs30.app/admin/callback

admin-email=ben.reed@sjsu.edu

git.server.ssh-host=localhost
git.server.ssh-user=divyam

judge.url=http://localhost:8000
judge.image=ghcr.io/sjsu-cs-systems-group/judge-sandbox:latest

server.servlet.session.timeout=1h

cs30.backend.url=https://sjsu.cs30.app

cs30.allowed-ips=

# Kiosk guard — shared secret the lab launcher presents. Windows/web lab sends it once as a query
# param and the server exchanges it for an HttpOnly cookie; the Linux/desktop app sends it as a
# header read from its process environment. Empty = gate off.
# Set CS30_KIOSK_SECRET in cs30.env to enable — never a literal here (gitleaks runs in CI).
# Applies to the student web and desktop apps only; the TA dashboard is exempt.
cs30.kiosk-secret=${CS30_KIOSK_SECRET:}

# Optional kiosk tuning — defaults shown. Changing a name here means changing the lab launcher too.
#cs30.kiosk.exempt-paths=/health,/login,/callback,/favicon.ico,/ta,/api/ta/
#cs30.kiosk.cookie-name=cs30_kiosk
#cs30.kiosk.header-name=X-CS30-Kiosk
#cs30.kiosk.param-name=kiosk
#cs30.kiosk.cookie-max-age-seconds=-1
#cs30.kiosk.blocked-message=CS30 must be started using the CS30 shortcut on the lab workstation.

docker.path=/usr/bin/docker

editor.max-custom-test-cases=1

bt.path=${BT_PATH:/usr/local/bin/bt}
canvas.url=${CANVAS_URL:https://sjsu.instructure.com}
canvas.token=${CANVAS_TOKEN:}
