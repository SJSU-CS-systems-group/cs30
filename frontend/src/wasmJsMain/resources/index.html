<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CS30 Code Editor</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231565C0'/%3E%3Ctext x='16' y='22' font-family='Arial,Helvetica,sans-serif' font-size='14' font-weight='700' fill='%23fff' text-anchor='middle'%3ECS%3C/text%3E%3C/svg%3E">
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        #composeApplication { width: 100vw; height: 100vh; display: block; }
        #htmlOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            margin: 0;
            padding: 0;
        }
        #htmlOverlay iframe {
            pointer-events: auto;
        }
        body.labx-lockdown, body.labx-lockdown * {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
        }
        body.labx-lockdown canvas {
            user-select: text;
            -webkit-user-select: text;
        }

        /* --- First-paint loading splash -----------------------------------------
           Inlined here rather than in a shared splash.css/js on purpose: this has to
           paint on the very first frame, before composeApp.js downloads and compiles
           the ~6MB wasm bundle. An external asset would be one more blocking fetch,
           which defeats the whole point.
           NOTE: ta.html carries a near-identical copy (green accent) — keep in sync. */
        #appSplash {
            position: fixed;
            inset: 0;
            z-index: 9999;                       /* below the Session Expired overlay (99999) */
            background: #FFFFFF;                 /* matches the real first painted frame */
            color: #1C1C1C;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 24px;
            text-align: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            opacity: 1;
            transition: opacity 220ms ease-out;
        }
        #appSplash.is-hiding { opacity: 0; pointer-events: none; }
        #appSplashSpinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(21, 101, 192, 0.18);
            border-top-color: #1565C0;
            border-radius: 50%;
            animation: appSplashSpin 900ms linear infinite;
        }
        @keyframes appSplashSpin { to { transform: rotate(360deg); } }
        #appSplashTitle { margin: 0; font-size: 20px; font-weight: 600; }
        #appSplashHint {
            margin: 0;
            font-size: 14px;
            opacity: 0.65;
            max-width: 36ch;
            line-height: 1.45;
        }
        #appSplashReload {
            display: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background: #1565C0;
            color: #FFFFFF;
        }
        #appSplash.is-stalled #appSplashSpinner { display: none; }
        #appSplash.is-stalled #appSplashReload { display: inline-block; }

        /* Rotation is the main vestibular trigger here, so swap it for a gentle
           opacity pulse — still signals "working", without the spinning. */
        @media (prefers-reduced-motion: reduce) {
            #appSplash { transition: none; }
            #appSplashSpinner { animation: appSplashPulse 1600ms ease-in-out infinite; }
            @keyframes appSplashPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
        }
    </style>
    <script>
        // --- First-paint loading splash ---
        // Kotlin calls window.__cs30HideSplash() from app/Splash.kt once Compose has
        // composed its first frame. See the #appSplash CSS above; ta.html has a copy.
        var cs30SplashStallTimer = setTimeout(function () {
            var el = document.getElementById('appSplash');
            if (!el) return;
            // Don't keep claiming we're building anything if the bundle clearly stalled.
            el.classList.add('is-stalled');
            var title = document.getElementById('appSplashTitle');
            var hint = document.getElementById('appSplashHint');
            if (title) title.textContent = 'This is taking longer than usual';
            if (hint) hint.textContent = 'The editor is still loading. If nothing happens, reload the page.';
            var reload = document.getElementById('appSplashReload');
            if (reload) reload.onclick = function () { window.location.reload(); };
        }, 20000);

        window.__cs30HideSplash = function () {
            clearTimeout(cs30SplashStallTimer);
            var el = document.getElementById('appSplash');
            if (!el) return;
            // Double rAF: first composition isn't first paint. Hiding on composition
            // alone can expose one blank frame before the canvas actually draws.
            requestAnimationFrame(function () {
                requestAnimationFrame(function () {
                    el.classList.add('is-hiding');
                    var remove = function () { if (el.parentNode) el.remove(); };
                    el.addEventListener('transitionend', remove, { once: true });
                    setTimeout(remove, 400);  // fallback if transitionend never fires
                });
            });
        };

        window.__labxLockdownOn = false;
        document.addEventListener('contextmenu', function (e) {
            if (window.__labxLockdownOn) e.preventDefault();
        }, true);

        // window.__cs30ApiToken is kept in sync with the Kotlin-side ApiToken by
        // GoogleAuthService.web.kt — this script runs outside the Kotlin HTTP layer
        // entirely, so it needs its own copy of the Bearer token to authenticate.

        var sessionExpiredShown = false;
        function handleSessionExpired() {
            if (sessionExpiredShown) return;
            sessionExpiredShown = true;

            var overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,255,255,0.97);color:#1565C0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:99999;font-family:system-ui,sans-serif;';
            overlay.innerHTML = '<h2 style="margin:0 0 10px 0;font-size:24px;">Session Expired</h2>' +
                '<p style="margin:0 0 20px 0;opacity:0.7;">Your session has timed out due to inactivity.</p>' +
                '<button id="sessionExpiredBtn" style="padding:12px 24px;font-size:16px;cursor:pointer;border:none;border-radius:6px;background:#1565C0;color:white;font-weight:600;">Return to Login</button>';
            document.body.appendChild(overlay);

            document.getElementById('sessionExpiredBtn').onclick = function() {
                window.__cs30ApiToken = null;
                window.location.href = '/';
            };
        }

        function checkSessionAndRedirect() {
            console.log('[session] checking session...');
            var headers = window.__cs30ApiToken ? { 'Authorization': 'Bearer ' + window.__cs30ApiToken } : {};
            fetch('/api/check-session', { method: 'POST', headers: headers })
                .then(res => res.json())
                .then(data => {
                    console.log('[session] response:', data);
                    // Redirect if session expired AND we have/had a token (not already on plain login page)
                    var hasToken = window.__cs30ApiToken || window.location.search.includes('api_token');
                    console.log('[session] hasActiveSession:', data.hasActiveSession, 'hasToken:', hasToken);
                    if (!data.hasActiveSession && hasToken) {
                        console.log('[session] session expired, handling logout');
                        handleSessionExpired();
                    }
                })
                .catch(err => { console.error('[session] error:', err); });
        }

        // When tab becomes visible, immediately check if session is still valid
        document.addEventListener('visibilitychange', function() {
            console.log('[session] visibility changed:', document.visibilityState);
            if (document.visibilityState === 'visible') {
                checkSessionAndRedirect();
            }
        });

        // Heartbeat to keep session alive while tab is visible (backend has 2-min TTL)
        setInterval(() => {
            if (document.visibilityState !== 'visible') return;
            checkSessionAndRedirect();
        }, 60000);

        // Logout session when tab/window is closed to end single session.
        // sendBeacon cannot set custom headers, so the token travels as a query param
        // instead of an Authorization header for this one call — same credential, backend
        // treats it identically either way.
        //
        // pagehide only, deliberately — not also beforeunload/unload. Those two are legacy events
        // that both disable the back-forward cache (bfcache) for this page, and unload in
        // particular isn't reliably fired on mobile browsers. pagehide is the modern replacement
        // for both and already covers every real "leaving the page" case a logout beacon needs.
        // Registering all three (as this used to) fires logoutOnUnload 2-3 times per tab close,
        // which used to cause concurrent git-commit collisions in the activity-log hook.
        function logoutOnUnload() {
            var token = window.__cs30ApiToken ? encodeURIComponent(window.__cs30ApiToken) : '';
            navigator.sendBeacon('/api/web-logout?token=' + token, '');
        }
        window.addEventListener('pagehide', logoutOnUnload);
    </script>
</head>
<body>
    <div id="appSplash" role="status" aria-live="polite">
        <div id="appSplashSpinner" aria-hidden="true"></div>
        <h1 id="appSplashTitle">Please wait while we build the universe</h1>
        <p id="appSplashHint">Loading your coding environment…</p>
        <button id="appSplashReload" type="button">Reload</button>
    </div>
    <div id="composeApplication"></div>
    <div id="htmlOverlay"></div>
    <script type="application/javascript" src="composeApp.js"></script>
</body>
</html>
