<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CS30 Code Editor</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231565C0'/%3E%3Ctext x='16' y='22' font-family='Arial,Helvetica,sans-serif' font-size='14' font-weight='700' fill='%23fff' text-anchor='middle'%3ECS%3C/text%3E%3C/svg%3E">
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        #composeApplication { width: 100vw; height: 100vh; display: block; }
        #htmlOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            margin: 0;
            padding: 0;
        }
        #htmlOverlay iframe {
            pointer-events: auto;
        }
        body.labx-lockdown, body.labx-lockdown * {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
        }
        body.labx-lockdown canvas {
            user-select: text;
            -webkit-user-select: text;
        }
    </style>
    <script>
        window.__labxLockdownOn = false;
        document.addEventListener('contextmenu', function (e) {
            if (window.__labxLockdownOn) e.preventDefault();
        }, true);

        // window.__cs30ApiToken is kept in sync with the Kotlin-side ApiToken by
        // GoogleAuthService.web.kt — this script runs outside the Kotlin HTTP layer
        // entirely, so it needs its own copy of the Bearer token to authenticate.
        setInterval(() => {
            var headers = window.__cs30ApiToken ? { 'Authorization': 'Bearer ' + window.__cs30ApiToken } : {};
            fetch('/api/check-session', { method: 'POST', headers: headers })
           .then(res => res.json())
           .then(data => {
               if (!data.hasActiveSession && window.location.pathname !== '/') {
                   // Session lost (server restart or timeout) - redirect to main page
                   window.location.href = '/';
               }
           })
           .catch(() => {});
        }, 60000); // Check session every 60 seconds

        // Logout session when tab/window is closed to end single session.
        // sendBeacon cannot set custom headers, so the token travels as a query param
        // instead of an Authorization header for this one call — same credential, backend
        // treats it identically either way.
        function logoutOnUnload() {
            var token = window.__cs30ApiToken ? encodeURIComponent(window.__cs30ApiToken) : '';
            navigator.sendBeacon('/api/web-logout?token=' + token, '');
        }
        window.addEventListener('pagehide', logoutOnUnload);
        window.addEventListener('beforeunload', logoutOnUnload);
        window.addEventListener('unload', logoutOnUnload);
    </script>
</head>
<body>
    <div id="composeApplication"></div>
    <div id="htmlOverlay"></div>
    <script type="application/javascript" src="composeApp.js"></script>
</body>
</html>
