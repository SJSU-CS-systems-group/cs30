<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CS30 Code Editor</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        #composeApplication { width: 100vw; height: 100vh; display: block; }
        #htmlOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            margin: 0;
            padding: 0;
        }
        #htmlOverlay iframe {
            pointer-events: auto;
        }
        body.labx-lockdown, body.labx-lockdown * {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
        }
        body.labx-lockdown canvas {
            user-select: text;
            -webkit-user-select: text;
        }
    </style>
    <script>
        window.__labxLockdownOn = false;
        document.addEventListener('contextmenu', function (e) {
            if (window.__labxLockdownOn) e.preventDefault();
        }, true);

        // Logout session when tab/window is closed (only if session cookie exists)
        function logoutOnUnload() {
            if (document.cookie.includes('JSESSIONID')) {
                navigator.sendBeacon('/api/web-logout', '');
            }
        }
        window.addEventListener('pagehide', logoutOnUnload);
        window.addEventListener('beforeunload', logoutOnUnload);
    </script>
</head>
<body>
    <div id="composeApplication"></div>
    <div id="htmlOverlay"></div>
    <script type="application/javascript" src="composeApp.js"></script>
</body>
</html>
